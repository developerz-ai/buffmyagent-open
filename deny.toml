# cargo-deny: what may enter the dependency graph. `bin/check` runs `cargo deny check`.

[graph]
# The systems a release is built for.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
# Any advisory is an error. An exception is a row here with the reason and a date to revisit.
ignore = []
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# A license in the list that no crate uses yet is not a problem.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# One TLS stack: rustls with bundled roots. One HTTP client: the broker's own.
deny = [
  { crate = "openssl", reason = "one TLS stack: rustls" },
  { crate = "openssl-sys", reason = "one TLS stack: rustls" },
  { crate = "native-tls", reason = "one TLS stack: rustls" },
  { crate = "rustls-platform-verifier", reason = "bundled roots only: the same trust on every system" },
  { crate = "rustls-native-certs", reason = "bundled roots only: the same trust on every system" },
  { crate = "reqwest", reason = "no HTTP client other than the broker's" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
