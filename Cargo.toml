# The workspace. A later slice adds a crate under crates/ or a binary under bins/ and does not
# edit this file: members are globs, and shared versions and lints are inherited.
[workspace]
members = ["crates/*", "bins/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/developerz-ai/buffmyagent-open"
publish = false

# One version of each shared dependency, pinned to a minor. A crate takes one with
# `name = { workspace = true }` and names the features it needs. Nothing here is compiled until a
# crate asks for it.
#
# TLS is rustls with the aws-lc-rs provider and the bundled webpki roots: the same roots on every
# system, no system store. `rustls-platform-verifier`, `rustls-native-certs`, `native-tls`,
# `openssl` and `reqwest` are refused by deny.toml and by tests/workspace_policy.rs.
[workspace.dependencies]
bma-types = { path = "crates/bma-types", version = "0.1.0" }

# async and HTTP
tokio = { version = "~1.54", default-features = false }
hyper = { version = "~1.13", default-features = false }
hyper-util = { version = "~0.1.21", default-features = false }
axum = { version = "~0.8.9", default-features = false }

# TLS and names
rustls = { version = "~0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
webpki-roots = "~1.0"
hickory-resolver = { version = "~0.26", default-features = false }
url = "~2.5"
idna = "~1.1"

# data
serde = { version = "~1.0", default-features = false, features = ["std"] }
serde_json = "~1.0"
thiserror = "~2.0"
tracing = { version = "~0.1", default-features = false, features = ["std"] }

# secrets and crypto
zeroize = "~1.9"
secrecy = "~0.10"
subtle = "~2.6"
sha2 = "~0.11"
hkdf = "~0.13"
aes-gcm = "~0.11"
argon2 = "~0.6"
p256 = "~0.14"
hpke = "~0.15"

# SQL
sqlx = { version = "~0.9", default-features = false }
sqlparser = "~0.64"

# tests
proptest = "~1.12"

# The shared list above lands whole, before the crates that use it, so that slices working side by
# side never edit this file. Cargo would warn about every entry no crate uses yet.
[workspace.lints.cargo]
unused_workspace_dependencies = "allow"

[workspace.lints.rust]
# A crate that needs `unsafe` (mlock) opts out by name in its own manifest, with a comment.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Denied outside tests: clippy.toml allows them in test code.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

# The root package holds no code. It exists so `tests/` can check the whole workspace.
[package]
name = "bma-workspace"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true
