name: ci

# The gate: the same `bin/check` a person or an agent runs locally, on the three systems a
# release is built for, plus the secret scan over the commits.
#
#   check (<os>)   bin/check: format, clippy, cargo deny, tests, vectors hash
#   secrets        bin/secrets: gitleaks over every commit of every ref that was fetched
#   ci             the one verdict over the jobs above
#
# `ci` is a REQUIRED check and keeps that name: branch protection looks the verdict up by it.
# The other required check, `public-repo-scan`, is posted by the maintainers' own scan and has no
# workflow in this repository.
#
# Runners are GitHub-hosted: this repository is public.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request makes the run in flight for it worthless, so it is cancelled.
# On main every commit keeps its own verdict.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      # Every system runs to its end: a failure on one says nothing about the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        # bin/ is bash on every system. On Windows this is Git Bash.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
      # The toolchain pinned in rust-toolchain.toml, with rustfmt and clippy.
      - run: rustup toolchain install --no-self-update
      # cargo-deny and gitleaks at the versions pinned in .mise.toml.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # mise reads GitHub release metadata; unauthenticated, a shared runner address hits
          # the rate limit.
          github_token: ${{ github.token }}
      - run: bin/check

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the scan reads commits, and a shallow clone has one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          github_token: ${{ github.token }}
      - run: bin/secrets

  # THE REQUIRED CHECK. Green only when every job above succeeded: a skipped or cancelled job is
  # not a pass. It runs when a job is red, because a skipped verdict reads as no verdict.
  ci:
    needs: [check, secrets]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHECK: ${{ needs.check.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: |
          echo "check: $CHECK"
          echo "secrets: $SECRETS"
          [ "$CHECK" = success ] && [ "$SECRETS" = success ]
